<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Fits phone screens (in case the redirect page shows for a split second). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Fortuna · Menu</title>

  <!-- TEMPORARY PAGE: sends anyone who opens the site's main address
       (or index.html) to the menu. When the owner's full website is ready,
       replace this whole file with the real home page. -->

  <!-- Tells search engines that the real page is menu.html, so Google
       lists the menu instead of this empty redirect page. -->
  <link rel="canonical" href="menu.html">

  <!-- Redirect method 1 (plain HTML, works even if JavaScript is off):
       content="0; url=menu.html" means "wait 0 seconds, then go to menu.html". -->
  <meta http-equiv="refresh" content="0; url=menu.html">

  <!-- Redirect method 2 (JavaScript, runs first because it's faster):
       location.replace() swaps this page for the menu in the browser history,
       so tapping the phone's Back button doesn't bounce the customer
       back here and straight into the menu again. -->
  <script>
    window.location.replace("menu.html");
  </script>
</head>
<body>
  <!-- Fallback 3: if both redirects are blocked, the visitor can tap this link. -->
  <p>
    <a href="menu.html">View the Mi Fortuna menu</a> ·
    <a href="menu.html">Ver el menú</a>
  </p>
</body>
</html>
